- name: roboshop instances creation
  hosts: localhost 
  become: yes 
  connection: local 
  tasks:
  - name: debug groups vars variables 
    debug:
      msg: "{{ image_id }}"
      
  - name: create ec2 instance 
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      security_groups: "{{ group_id }}"
    loop: "{{ instances }}"
    register: ec2_output
    when: action == "create"
    register: ec2_output

  - name: debug ec2 instance output
    debug: 
      msg: ec2_output 