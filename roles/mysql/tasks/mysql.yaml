- name: mysql setup 
  hosts: mysql
  become: yes 
  tasks:
  - name: install mysql
    package:
      name: mysql-server 
      state: present 
  - name: enable and start mysqld 
    shell: 
      systemctl enable mysqld && 
      systemctl start mysqld  
  - name: set root password 
    shell:
      mysql_secure_installation --set-root-pass RoboShop@1